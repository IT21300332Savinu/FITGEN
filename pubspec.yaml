name: fitgen
description: "AI Smart Fitness Companion with pose detection"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.6.5
  
  # Camera and ML Kit (Stable versions)
  camera: ^0.10.5
  google_mlkit_pose_detection: 0.12.1
  google_mlkit_commons: ^0.8.1
  # ML Kit text recognition used by ai_medical_guidance
  google_mlkit_text_recognition: ^0.13.1
  # Charts used in medical dashboard - upgraded for compatibility
  fl_chart: ^0.69.0
  
  # Image processing
  image: ^4.0.17
  
  # Storage and utilities
  path_provider: ^2.1.1
  provider: ^6.1.1
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  
  # Bluetooth (for wearables - optional)
  flutter_blue_plus: ^1.35.3
  
  # Web camera support
  camera_web: ^0.3.5
  
  # Text-to-speech for voice coaching
  flutter_tts: ^3.8.5
  
  # Permissions
  permission_handler: ^11.0.0
  image_picker: ^1.2.0
  
  # FlutterFlow dependencies
  go_router: 12.1.3
  from_css_color: 2.0.0
  mime_type: ^1.0.0
  google_sign_in: ^6.1.5
  sign_in_with_apple: ^7.0.0
  google_maps_flutter: ^2.5.0
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  table_calendar: ^3.0.9
  dropdown_button2: ^2.3.9
  
  # API and HTTP
  dio: ^5.3.3
  http: ^1.3.0
  
  # Additional FlutterFlow utilities
  auto_size_text: ^3.0.0
  font_awesome_flutter: ^10.6.0
  timeago: ^3.5.0
  page_transition: ^2.1.0
  animations: ^2.0.11
  url_launcher: ^6.2.1
  equatable: ^2.0.5
  json_path: ^0.7.2
  flutter_animate: ^4.3.0
  flutter_cache_manager: ^3.3.1
  video_player: ^2.8.1
  file_picker: ^8.0.0+1
  package_info_plus: ^9.0.0
  # Downgrade sqflite to avoid Android API 35-only constants in sqflite_android 2.4.x
  # 2.3.3+1 uses a compatible Android implementation without BAKLAVA/Locale.of/threadId
  sqflite: ^2.3.3+1
  rxdart: ^0.27.7
  stop_watch_timer: ^3.1.1
  smooth_page_indicator: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  # Force Android implementation to a version that doesn't require API 35-only constants
  sqflite_android: 2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/audios/
    - assets/videos/
    - assets/jsons/
    - assets/pdfs/
    - assets/rive_animations/
  
  # fonts:
  #   - family: Outfit
  #     fonts:
  #       - asset: assets/fonts/Outfit-Regular.ttf
  #       - asset: assets/fonts/Outfit-Bold.ttf
  #         weight: 700
  #   - family: Readex Pro
  #     fonts:
  #       - asset: assets/fonts/ReadexPro-Regular.ttf
  #       - asset: assets/fonts/ReadexPro-Bold.ttf
  #         weight: 700